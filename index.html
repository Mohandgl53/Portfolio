<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('mk-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mohan Kumar T — AI Engineer & Full-Stack Systems Architect</title>
  <meta name="description" content="Mohan Kumar T, final-year B.Tech AI&DS student at P.S.R.R. College of Engineering building resilient AI agents, scalable distributed full-stack systems, and production web architectures.">
  <meta property="og:title" content="Mohan Kumar T — AI Engineer & Full-Stack Systems Architect">
  <meta property="og:description" content="Explore Zugora chess engine coach, MahathRishi bilingual e-commerce, LocalMind local-first AI agent with MCP authorization, and IIT NPTEL Gold/Silver honors.">

  <!-- Instant 0-ms Critical Styles: Placed at top of head before any network request -->
  <style>
    /* ── SOLAR MINIMALIST SUN PRELOADER (GPU ACCELERATED) ── */
    #solar-preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #070c18;
      color: #f8fafc;
      user-select: none;
      pointer-events: all;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.45s ease;
      will-change: opacity, transform, filter;
    }

    [data-theme="light"] #solar-preloader {
      background-color: #f8fafc;
      color: #0f172a;
    }

    #solar-preloader.solar-fadeout {
      opacity: 0;
      transform: scale(1.03);
      filter: blur(8px);
      pointer-events: none;
    }

    .solar-center-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hardware Composited: Dedicated GPU plane prevents any stutter during JS execution */
    .solar-sun-svg {
      width: clamp(72px, 12vw, 96px);
      height: clamp(72px, 12vw, 96px);
      animation: solar-spin 1.25s linear infinite;
      transform-origin: 50% 50%;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      contain: strict;
      backface-visibility: hidden;
    }

    @keyframes solar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .solar-counter-corner {
      position: absolute;
      right: clamp(2rem, 5vw, 4.5rem);
      bottom: clamp(2rem, 5vw, 4.5rem);
      display: flex;
      align-items: baseline;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-feature-settings: 'tnum' 1;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
    }

    .solar-digit {
      font-size: clamp(4.5rem, 11vw, 8.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: currentColor;
    }

    .solar-percent {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 700;
      margin-left: 0.15em;
      color: #38bdf8;
    }

    [data-theme="light"] .solar-percent {
      color: #2563eb;
    }
  </style>

  <!-- Non-Blocking Modern Fonts: Will not stall first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <!-- 0-ms Instant Solar Sun Preloader: Starts at 3% immediately with zero wait -->
  <div id="solar-preloader" aria-label="Loading portfolio">
    <div class="solar-center-icon">
      <svg class="solar-sun-svg" viewBox="0 0 100 100" fill="none">
        <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="50" y1="12" x2="50" y2="28" opacity="0.08" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(15 50 50)" opacity="0.12" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(30 50 50)" opacity="0.16" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(45 50 50)" opacity="0.20" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(60 50 50)" opacity="0.24" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(75 50 50)" opacity="0.28" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(90 50 50)" opacity="0.32" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(105 50 50)" opacity="0.36" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(120 50 50)" opacity="0.40" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(135 50 50)" opacity="0.45" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(150 50 50)" opacity="0.50" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(165 50 50)" opacity="0.55" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(180 50 50)" opacity="0.60" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(195 50 50)" opacity="0.65" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(210 50 50)" opacity="0.70" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(225 50 50)" opacity="0.75" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(240 50 50)" opacity="0.80" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(255 50 50)" opacity="0.85" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(270 50 50)" opacity="0.90" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(285 50 50)" opacity="0.93" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(300 50 50)" opacity="0.96" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(315 50 50)" opacity="0.98" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(330 50 50)" opacity="1.0" />
          <line x1="50" y1="12" x2="50" y2="28" transform="rotate(345 50 50)" opacity="1.0" />
        </g>
      </svg>
    </div>

    <div class="solar-counter-corner">
      <span id="solar-counter-val" class="solar-digit">3</span>
      <span class="solar-percent">%</span>
    </div>
  </div>

  <script>
    (function() {
      var counterEl = document.getElementById('solar-counter-val');
      var preloader = document.getElementById('solar-preloader');
      if (!counterEl || !preloader) return;

      var steps = [3, 25, 59, 84, 100];
      var stepIdx = 0;
      var isReady = false;

      if (document.readyState === 'complete') {
        isReady = true;
      } else {
        window.addEventListener('load', function() { isReady = true; });
      }

      function stepToNext() {
        if (stepIdx < steps.length - 2) {
          stepIdx++;
          counterEl.textContent = steps[stepIdx];
          var delays = [90, 100, 110];
          setTimeout(stepToNext, delays[stepIdx - 1] || 100);
        } else if (stepIdx === steps.length - 2) {
          stepIdx++;
          counterEl.textContent = '84';
          // Now check for ready to hit 100
          var poll = setInterval(function() {
            if (isReady || document.readyState === 'complete') {
              clearInterval(poll);
              counterEl.textContent = '100';
              setTimeout(function() {
                preloader.classList.add('solar-fadeout');
                setTimeout(function() {
                  if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
                }, 500);
              }, 160);
            }
          }, 30);
        }
      }

      // Step from 3% to 25% smoothly and immediately after 75ms
      setTimeout(stepToNext, 75);
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
