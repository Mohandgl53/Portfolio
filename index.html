<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('mk-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mohan Kumar T — AI Engineer & Full-Stack Systems Architect</title>
  <meta name="description" content="Mohan Kumar T, final-year B.Tech AI&DS student at P.S.R.R. College of Engineering building resilient AI agents, scalable distributed full-stack systems, and production web architectures.">
  <meta property="og:title" content="Mohan Kumar T — AI Engineer & Full-Stack Systems Architect">
  <meta property="og:description" content="Explore Zugora chess engine coach, MahathRishi bilingual e-commerce, LocalMind local-first AI agent with MCP authorization, and IIT NPTEL Gold/Silver honors.">

  <!-- Instant 0-ms Critical Styles: Placed at top of head before any network request -->
  <style>
    /* ── MINIMALIST SOLAR CORONA PRELOADER (GPU ACCELERATED) ── */
    #solar-preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #070c18;
      color: #38bdf8;
      user-select: none;
      pointer-events: all;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.22s ease;
      will-change: opacity, transform, filter;
    }

    [data-theme="light"] #solar-preloader {
      background-color: #f8fafc;
      color: #2563eb;
    }

    #solar-preloader.solar-fadeout {
      opacity: 0;
      transform: scale(1.02);
      filter: blur(4px);
      pointer-events: none;
    }

    .solar-center-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hardware Composited: Dedicated GPU plane prevents any stutter during JS execution */
    .solar-sun-svg {
      width: 52px;
      height: 52px;
      animation: solar-spin 0.75s linear infinite;
      transform-origin: 50% 50%;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      contain: strict;
      backface-visibility: hidden;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
    }

    [data-theme="light"] .solar-sun-svg {
      filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.25));
    }

    @keyframes solar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Non-Blocking Modern Fonts: Carefully Selected Typography Hierarchy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Fira+Code:wght@400;500;600&family=Manrope:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <!-- 0-ms Instant Minimalist Solar Preloader: Fast & Elegant -->
  <div id="solar-preloader" aria-label="Loading portfolio">
    <div class="solar-center-icon">
      <svg class="solar-sun-svg" viewBox="0 0 48 48" fill="none">
        <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <line x1="24" y1="5" x2="24" y2="13" opacity="0.12" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(30 24 24)" opacity="0.18" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(60 24 24)" opacity="0.25" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(90 24 24)" opacity="0.32" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(120 24 24)" opacity="0.42" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(150 24 24)" opacity="0.52" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(180 24 24)" opacity="0.62" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(210 24 24)" opacity="0.72" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(240 24 24)" opacity="0.82" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(270 24 24)" opacity="0.90" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(300 24 24)" opacity="0.96" />
          <line x1="24" y1="5" x2="24" y2="13" transform="rotate(330 24 24)" opacity="1.0" />
        </g>
        <circle cx="24" cy="24" r="2.4" fill="currentColor" opacity="0.9" />
      </svg>
    </div>
  </div>

  <script>
    (function() {
      var preloader = document.getElementById('solar-preloader');
      if (!preloader) return;

      var dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        preloader.classList.add('solar-fadeout');
        setTimeout(function() {
          if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
        }, 240);
      }

      // Fast dismissal: Dissolve immediately when ready with zero artificial delay
      if (document.readyState === 'complete') {
        setTimeout(dismiss, 80);
      } else {
        window.addEventListener('load', function() {
          setTimeout(dismiss, 60);
        });
        // Never keep the user waiting more than 260ms under any condition
        setTimeout(dismiss, 260);
      }
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
